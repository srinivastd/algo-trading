name: Pythonclient CI

on:
  pull_request:
    paths:
      - "pythonclient/**"
      - ".github/workflows/pythonclient-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pythonclient/**"
      - ".github/workflows/pythonclient-ci.yml"

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tool
        run: python -m pip install --upgrade pip ruff

      - name: Detect changed Python files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"
          FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '^pythonclient/src/.*\.py$' || true)"
          FILES="${FILES//$'\n'/ }"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: $FILES"

      - name: Lint changed files (critical errors only)
        if: ${{ steps.changed.outputs.files != '' }}
        run: ruff check ${{ steps.changed.outputs.files }} --select E9,F63,F7,F82

      - name: Skip lint when no Python files changed
        if: ${{ steps.changed.outputs.files == '' }}
        run: echo "No changed pythonclient/src Python files to lint."

      - name: Compile check
        run: python -m compileall -q pythonclient/src
