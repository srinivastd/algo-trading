name: Pythonclient CI

on:
  pull_request:
    paths:
      - "pythonclient/**"
      - ".github/workflows/pythonclient-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pythonclient/**"
      - ".github/workflows/pythonclient-ci.yml"

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tool
        run: python -m pip install --upgrade pip ruff

      - name: Lint (critical errors only)
        run: ruff check pythonclient/src --select E9,F63,F7,F82

      - name: Compile check
        run: python -m compileall -q pythonclient/src
